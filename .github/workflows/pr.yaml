---
    name: "PR workflow"

    on:
      pull_request:
        types:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        paths-ignore:
          - 'static/**'
          - '**.md'
          - '.gitignore'
          - '.github/ISSUE_TEMPLATE/**'
          - 'fastlane/**'
      workflow_dispatch:
        inputs:
          logLevel:
            description: 'Log level'
            required: true
            default: 'warning'
          signpath_sign:
            description: 'sign binary by signpath'
            required: false
            default: false
            type: boolean
          run_android:
            description: 'manually run android build'
            required: false
            default: false
            type: boolean
          run_windows:
            description: 'manually run windows build'
            required: false
            default: false
            type: boolean
          run_ios:
            description: 'manually run ios build'
            required: false
            default: false
            type: boolean
          run_macos:
            description: 'manually run macos build'
            required: false
            default: false
            type: boolean
          run_linux:
            description: 'manually run linux build'
            required: false
            default: false
            type: boolean

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
    
    jobs:
      flutter-test:
        if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Install native build tools
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build g++
            shell: bash
          - name: Run Flutter tests
            run: flutter test
            shell: bash

      flutter-analyze:
        if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Analyze Flutter project
            run: flutter analyze --no-fatal-infos --fatal-warnings
            shell: bash


      flutter-build-android:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_android || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for android"
        runs-on: "ubuntu-latest"
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
            shell: bash
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'          
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            id: flutter-action
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Remove build id
            run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
          - name: Print Flutter version
            run: flutter doctor -v
            shell: bash
          - name: Build Flutter for Android
            run: >-
              flutter build apk --split-per-abi
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          - name: Package android build output
            run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_canary.apk
            shell: bash

          - name: Upload android outputs
            uses: actions/upload-artifact@v4
            with:
              name: android_outputs
              path: Kazumi_android_*.apk

      flutter-build-windows:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_windows || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for windows"
        runs-on: "windows-latest"
        permissions: write-all
    
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - run: choco install yq
          - name: Enable Git longpaths
            run: git config --system core.longpaths true
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Set up Java
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '18'
          - run: flutter pub get
          - run: >-
              flutter build windows
              --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
          - name: Generate Windows portable manifest
            shell: pwsh
            run: |
              $ErrorActionPreference = 'Stop'
              Set-StrictMode -Version Latest
              $utf8 = [System.Text.UTF8Encoding]::new($false, $true)
              $root = Get-Item -LiteralPath 'build/windows/x64/runner/Release' -Force
              function Assert-PackageItem($item) {
                # Inspect before recursion: reparse points may lead outside the package.
                # Compress-Archive skips hidden entries, so reject them to keep sets equal.
                if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                  throw "Reparse point is not supported: $($item.FullName)"
                }
                if ($item.Attributes -band [IO.FileAttributes]::Hidden) {
                  throw "Hidden package entry is not supported: $($item.FullName)"
                }
              }
              Assert-PackageItem $root
              if (-not $root.PSIsContainer) { throw 'Package root must be a directory' }

              # Use the build input, never the release tag/canary label. This is a restricted
              # top-level YAML scalar reader; unsupported syntax fails instead of guessing.
              $declarations = @([IO.File]::ReadAllLines((Join-Path $PWD 'pubspec.yaml'), $utf8) |
                Where-Object { $_ -cmatch '^(?:version|''version''|"version")[ \t]*:' })
              if ($declarations.Count -ne 1) { throw 'Expected exactly one top-level version' }
              $versionMatch = [regex]::Match($declarations[0],
                '^version[ \t]*:[ \t]*(?<q>[''"]?)(?<v>[0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\k<q>(?:[ \t]+#[^\r\n]*)?[ \t]*$')
              if (-not $versionMatch.Success) { throw 'Unsupported pubspec version syntax' }

              $files = [Collections.Generic.List[string]]::new()
              function Visit-Directory($directory) {
                foreach ($item in Get-ChildItem -LiteralPath $directory -Force -ErrorAction Stop) {
                  Assert-PackageItem $item
                  $relative = [IO.Path]::GetRelativePath($root.FullName, $item.FullName).Replace('\', '/')
                  if ($relative -cmatch '[\p{Cc}]') {
                    throw "Invalid manifest path: $relative"
                  }
                  if ($relative -ieq 'file-manifest.json') {
                    # Excluding the prior output makes reruns identical; directories/links
                    # must never be overwritten. Require canonical spelling in the archive.
                    if ($item.PSIsContainer -or $relative -cne 'file-manifest.json') {
                      throw 'Manifest output must be a regular file with canonical spelling'
                    }
                    continue
                  }
                  if ($item.PSIsContainer) { Visit-Directory $item.FullName }
                  else { $files.Add($relative) }
                }
              }
              Visit-Directory $root.FullName
              # Ordinal hex comparison exactly preserves UTF-8 byte order, including prefixes;
              # locale-dependent sorting and UTF-16 ordinal sorting do not satisfy the protocol.
              $sorted = [Collections.Generic.SortedDictionary[string,string]]::new([StringComparer]::Ordinal)
              foreach ($path in $files) { $sorted.Add([Convert]::ToHexString($utf8.GetBytes($path)), $path) }
              $manifest = [ordered]@{
                schemaVersion = 1
                appId = 'kazumi'
                packageType = 'windowsPortable'
                version = $versionMatch.Groups['v'].Value
                architecture = 'x64'
                files = @($sorted.Values)
              }
              # Paths only: signing may change bytes. The manifest belongs only in portable ZIPs;
              # clean the shared Release directory after archiving and after signed ZIP extraction.
              # Errors propagate and stop packaging; never fall back to a stale manifest.
              $json = ($manifest | ConvertTo-Json -Depth 4).Replace("`r`n", "`n") + "`n"
              [IO.File]::WriteAllText((Join-Path $root.FullName 'file-manifest.json'), $json, $utf8)
          - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows_canary.zip
          - name: Remove portable manifest from Windows build output
            shell: pwsh
            run: |
              # The ZIP already owns its copy; prevent later packages from inheriting this file.
              Remove-Item -LiteralPath 'build/windows/x64/runner/Release/file-manifest.json' -ErrorAction Stop
          - name: Upload windows outputs
            id: unsigned-windows-packet-artifacts
            uses: actions/upload-artifact@v4
            with:
              name: windows_outputs
              path: |
                Kazumi_windows_*.zip
          # - name: Build unsigned msix
          #   run: dart run msix:create
          # - name: Upload windows msix ouputs
          #   uses: actions/upload-artifact@v4
          #   id: unsigned-windows-msix-artifacts
          #   with:
          #     name: windows_msix_outputs
          #     path: |
          #       build/windows/x64/runner/Release/kazumi.msix
          
          # - run: New-Item -Path "build/windows/msix_signed_output" -ItemType Directory
          # - name: sign windows msix
          #   if: ${{ github.event.inputs.signpath_sign == 'true'}}
          #   uses: signpath/github-action-submit-signing-request@v1
          #   with:
          #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          #     organization-id: 'fa047255-4772-4be1-b14f-5cfa62635877'
          #     project-slug: 'Kazumi'
          #     signing-policy-slug: 'test-signing'
          #     artifact-configuration-slug: 'MSIX'
          #     github-artifact-id: '${{ steps.unsigned-windows-msix-artifacts.outputs.artifact-id }}'
          #     wait-for-completion: true
          #     output-artifact-directory: 'build/windows/msix_signed_output'
          
          # - name: Upload windows msix signed ouputs
          #   if: ${{ github.event.inputs.signpath_sign == 'true'}}
          #   uses: actions/upload-artifact@v4
          #   id: signed-windows-msix-artifacts
          #   with:
          #     name: windows_msix_signed_outputs
          #     path: build/windows/msix_signed_output/*.msix


      flutter-build-ios:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_ios || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for iOS"
        runs-on: "macos-latest"
        permissions: write-all

        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - run: flutter pub get
          - name: Install native build tools
            run: brew install cmake ninja
          - name: Build IPA
            run: >-
              flutter build ios --release --no-codesign
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          - name: Create IPA
            run: |
              mkdir Payload
              cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
              find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
              zip -q -r Kazumi_ios_canary_no_sign.ipa Payload
          - name: Upload iOS build
            uses: actions/upload-artifact@v4
            with:
              name: ios_outputs
              path: Kazumi_ios_*.ipa

      flutter-build-macos:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_macos || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for Macos"
        runs-on: "macos-latest"
        permissions: write-all

        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - run: flutter pub get
          - name: Install native build tools
            run: brew install cmake ninja
          - run: >-
              flutter build macos --release
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          - name: Create DMG
            run: |
              npm install --global create-dmg
              create-dmg build/macos/Build/Products/Release/Kazumi.app
            continue-on-error: true
          - name: Rename DMG
            run: mv Kazumi*.dmg Kazumi_macos_canary.dmg
          - name: Upload MacOS build
            uses: actions/upload-artifact@v4
            with:
              name: macos_outputs
              path: Kazumi_macos_*.dmg

      flutter-build-linux-amd64:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_linux || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for Linux amd64"
        runs-on: "ubuntu-latest" 
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev unzip webkit2gtk-4.1 libasound2-dev
              sudo apt-get install -y gcc g++ autoconf automake debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev \
                  libarchive-dev libbluray-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev libdrm-dev \
                  libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
                  libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
                  libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
                  libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
                  libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
                  libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
                  libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev \
                  libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
                  linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
                  x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
                  unixodbc-dev libpq-dev libxxhash-dev libaom-dev 
            shell: bash
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Build Flutter for Linux
            run: >-
              flutter build linux
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          # - name: Download FFmpeg Assets
          #   uses: dsaltares/fetch-gh-release-asset@master
          #   with:
          #     repo: 'Predidit/avbuild'
          #     version: 'tags/1.1.0'
          #     file: 'ffmpeg_linux_amd64.zip'
          #     token: ${{ secrets.GITHUB_TOKEN }}
          # - run: rm -f build/linux/x64/release/bundle/lib/libffmpeg.so.7
          # - run: unzip ffmpeg_linux_amd64.zip -d build/linux/x64/release/bundle/lib
          - name: Generate Linux amd64 portable manifest
            shell: bash
            run: |
              python3 - build/linux/x64/release/bundle x64 <<'PY'
              import json
              import os
              from pathlib import Path
              import re
              import stat
              import sys

              root = Path(sys.argv[1]).absolute()
              # The amd64 job passes x64 to match the manifest architecture values.
              architecture = sys.argv[2]
              if not stat.S_ISDIR(root.lstat().st_mode):
                  raise ValueError("Bundle root must be a real directory")
              root = root.resolve(strict=True)

              # Read the build input, never a release tag/canary label. This intentionally
              # supports only a restricted top-level YAML scalar, not arbitrary YAML syntax.
              lines = Path("pubspec.yaml").read_text(encoding="utf-8-sig").splitlines()
              declarations = [line for line in lines
                              if re.match(r"^(?:version|'version'|\"version\")[ \t]*:", line)]
              if len(declarations) != 1:
                  raise ValueError("Expected exactly one top-level version")
              match = re.fullmatch(
                  r"version[ \t]*:[ \t]*(?P<q>['\"]?)(?P<v>[0-9]+\.[0-9]+\.[0-9]+)"
                  r"(?:\+[0-9]+)?(?P=q)(?:[ \t]+#[^\r\n]*)?[ \t]*", declarations[0])
              if match is None:
                  raise ValueError("Unsupported pubspec version syntax")

              files = []
              def visit(directory):
                  # scandir includes hidden entries and reports enumeration failures. Inspect
                  # links before directories: record the link itself, never walk its target.
                  # Build output is trusted; tar preserves link targets without resolving them.
                  with os.scandir(directory) as entries:
                      for entry in entries:
                          path = Path(entry.path)
                          relative = path.relative_to(root).as_posix()
                          if ("\\" in relative or re.match(r"^[A-Za-z]:", relative)
                                  or any(ord(c) < 32 or 127 <= ord(c) <= 159 for c in relative)):
                              raise ValueError(f"Invalid manifest path: {relative!r}")
                          mode = entry.stat(follow_symlinks=False).st_mode
                          if relative == "file-manifest.json":
                              # Only a regular prior manifest may be overwritten; exclude it
                              # so repeated runs are identical. Any failure stops packaging.
                              if not stat.S_ISREG(mode):
                                  raise ValueError("Manifest output must be a regular file")
                              continue
                          if stat.S_ISLNK(mode):
                              files.append(relative)
                          elif stat.S_ISDIR(mode):
                              visit(path)
                          elif stat.S_ISREG(mode):
                              files.append(relative)
                          else:
                              raise ValueError(f"Unsupported file type: {relative}")

              visit(root)
              manifest = {
                  "schemaVersion": 1,
                  "appId": "kazumi",
                  "packageType": "linuxPortable",
                  "version": match.group("v"),
                  "architecture": architecture,
                  "files": sorted(files, key=lambda path: path.encode("utf-8")),
              }
              # Paths only: signing may change bytes. Preserve tar permissions/link semantics;
              # remove the portable-only manifest from the shared bundle before DEB staging.
              # No exception fallback: a stale manifest must never permit a failed job to publish.
              with (root / "file-manifest.json").open("w", encoding="utf-8", newline="\n") as output:
                  output.write(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
              PY
          - name: Package linux amd64 build output
            run: |
              set -e
              # Tarball package
              tar -zcvf Kazumi_linux_canary_amd64.tar.gz -C build/linux/x64/release/bundle .

              # The tarball retains its copy. Abort on cleanup failure so DEB cannot inherit it.
              rm -- build/linux/x64/release/bundle/file-manifest.json

              # Debian package
              mkdir Kazumi_linux_canary_amd64
              cd Kazumi_linux_canary_amd64
              mkdir -p opt/Kazumi
              mkdir -p usr/share/applications
              mkdir -p usr/share/icons/hicolor/512x512/apps
              cp -r ../build/linux/x64/release/bundle/* opt/Kazumi
              cp -r ../assets/linux/DEBIAN .
              chmod 0755 DEBIAN/postinst
              chmod 0755 DEBIAN/postrm

              cat>DEBIAN/control<<EOF
              Maintainer: madoka773 <valigarmanda55@gmail.com>
              Package: Kazumi
              Version: 0.0.1
              Section: x11
              Priority: optional
              Architecture: amd64
              Essential: no
              Installed-Size: 34648
              Description: Watch Animes online with danmaku support.
              Homepage: https://github.com/Predidit/Kazumi
              Depends: libayatana-appindicator3-1,
                       gir1.2-ayatanaappindicator3-0.1,
                       libwebkit2gtk-4.1-0
              EOF

              cp ../assets/linux/io.github.Predidit.Kazumi.desktop usr/share/applications
              cp ../assets/images/logo/logo_linux.png usr/share/icons/hicolor/512x512/apps/io.github.Predidit.Kazumi.png

              cd ..
              dpkg-deb --build --root-owner-group Kazumi_linux_canary_amd64
            shell: bash

          - name: Upload linux amd64 outputs
            uses: actions/upload-artifact@v4
            with:
              name: linux_amd64_outputs
              path: |
                Kazumi_linux_*.tar.gz
                Kazumi_linux_*.deb

      flutter-build-linux-arm64:
        needs: [flutter-test, flutter-analyze]
        if: ${{ (github.event_name == 'pull_request' && ! github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && (inputs.run_linux || (! inputs.run_android && ! inputs.run_windows && ! inputs.run_ios && ! inputs.run_macos && ! inputs.run_linux))) }}
        name: "Release for Linux arm64"
        runs-on: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Echo build progress
            run: echo "Kazumi_linux_canary_arm64 build progress"
            shell: bash
          - name: Set up Flutter for ARM64
            uses: ./.github/actions/flutter-arm64-setup
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Install project dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libsoup-3.0-dev libasound2-dev \
                libayatana-appindicator3-dev libepoxy-dev libmpv-dev unzip
            shell: bash
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Build Flutter for Linux ARM64
            run: >-
              flutter build linux
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          - name: Generate Linux arm64 portable manifest
            shell: bash
            run: |
              python3 - build/linux/arm64/release/bundle arm64 <<'PY'
              import json
              import os
              from pathlib import Path
              import re
              import stat
              import sys

              root = Path(sys.argv[1]).absolute()
              # The amd64 job passes x64 to match the manifest architecture values.
              architecture = sys.argv[2]
              if not stat.S_ISDIR(root.lstat().st_mode):
                  raise ValueError("Bundle root must be a real directory")
              root = root.resolve(strict=True)

              # Read the build input, never a release tag/canary label. This intentionally
              # supports only a restricted top-level YAML scalar, not arbitrary YAML syntax.
              lines = Path("pubspec.yaml").read_text(encoding="utf-8-sig").splitlines()
              declarations = [line for line in lines
                              if re.match(r"^(?:version|'version'|\"version\")[ \t]*:", line)]
              if len(declarations) != 1:
                  raise ValueError("Expected exactly one top-level version")
              match = re.fullmatch(
                  r"version[ \t]*:[ \t]*(?P<q>['\"]?)(?P<v>[0-9]+\.[0-9]+\.[0-9]+)"
                  r"(?:\+[0-9]+)?(?P=q)(?:[ \t]+#[^\r\n]*)?[ \t]*", declarations[0])
              if match is None:
                  raise ValueError("Unsupported pubspec version syntax")

              files = []
              def visit(directory):
                  # scandir includes hidden entries and reports enumeration failures. Inspect
                  # links before directories: record the link itself, never walk its target.
                  # Build output is trusted; tar preserves link targets without resolving them.
                  with os.scandir(directory) as entries:
                      for entry in entries:
                          path = Path(entry.path)
                          relative = path.relative_to(root).as_posix()
                          if ("\\" in relative or re.match(r"^[A-Za-z]:", relative)
                                  or any(ord(c) < 32 or 127 <= ord(c) <= 159 for c in relative)):
                              raise ValueError(f"Invalid manifest path: {relative!r}")
                          mode = entry.stat(follow_symlinks=False).st_mode
                          if relative == "file-manifest.json":
                              # Only a regular prior manifest may be overwritten; exclude it
                              # so repeated runs are identical. Any failure stops packaging.
                              if not stat.S_ISREG(mode):
                                  raise ValueError("Manifest output must be a regular file")
                              continue
                          if stat.S_ISLNK(mode):
                              files.append(relative)
                          elif stat.S_ISDIR(mode):
                              visit(path)
                          elif stat.S_ISREG(mode):
                              files.append(relative)
                          else:
                              raise ValueError(f"Unsupported file type: {relative}")

              visit(root)
              manifest = {
                  "schemaVersion": 1,
                  "appId": "kazumi",
                  "packageType": "linuxPortable",
                  "version": match.group("v"),
                  "architecture": architecture,
                  "files": sorted(files, key=lambda path: path.encode("utf-8")),
              }
              # Paths only: signing may change bytes. Preserve tar permissions/link semantics;
              # remove the portable-only manifest from the shared bundle before DEB staging.
              # No exception fallback: a stale manifest must never permit a failed job to publish.
              with (root / "file-manifest.json").open("w", encoding="utf-8", newline="\n") as output:
                  output.write(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
              PY
          - name: Package linux arm64 build output
            run: |
              set -e
              # Tarball package
              tar -zcvf Kazumi_linux_canary_arm64.tar.gz -C build/linux/arm64/release/bundle .

              # The tarball retains its copy. Abort on cleanup failure so DEB cannot inherit it.
              rm -- build/linux/arm64/release/bundle/file-manifest.json

              # Debian package
              mkdir Kazumi_linux_canary_arm64
              cd Kazumi_linux_canary_arm64
              mkdir -p opt/Kazumi
              mkdir -p usr/share/applications
              mkdir -p usr/share/icons/hicolor/512x512/apps
              cp -r ../build/linux/arm64/release/bundle/* opt/Kazumi
              cp -r ../assets/linux/DEBIAN .
              chmod 0755 DEBIAN/postinst
              chmod 0755 DEBIAN/postrm

              cat>DEBIAN/control<<EOF
              Maintainer: madoka773 <valigarmanda55@gmail.com>
              Package: Kazumi
              Version: 0.0.1
              Section: x11
              Priority: optional
              Architecture: arm64
              Essential: no
              Installed-Size: $(du -sk opt | cut -f1)
              Description: Watch Animes online with danmaku support.
              Homepage: https://github.com/Predidit/Kazumi
              Depends: libayatana-appindicator3-1,
                       gir1.2-ayatanaappindicator3-0.1,
                       libwebkit2gtk-4.1-0
              EOF

              cp ../assets/linux/io.github.Predidit.Kazumi.desktop usr/share/applications
              cp ../assets/images/logo/logo_linux.png usr/share/icons/hicolor/512x512/apps/io.github.Predidit.Kazumi.png

              cd ..
              dpkg-deb --build --root-owner-group Kazumi_linux_canary_arm64
            shell: bash

          - name: Upload linux arm64 outputs
            uses: actions/upload-artifact@v4
            with:
              name: linux_arm64_outputs
              path: |
                Kazumi_linux_*.tar.gz
                Kazumi_linux_*.deb
