          DART

      # ============================================================
      # 格式化
      # ============================================================

      - name: 格式化修改文件
        run: |
          dart format \
            lib/pages/menu/menu.dart \
            lib/pages/my/my_page.dart \
            lib/pages/my/my_space_view.dart

      # ============================================================
      # 安装依赖
      # ============================================================

      - name: 安装 Flutter 依赖
        run: flutter pub get

      # ============================================================
      # 先做针对性静态检查
      #
      # 比全项目 analyze 更快，
      # 同时最容易发现本次修改的编译问题。
      # ============================================================

      - name: 检查新版我的页面代码
        run: |
          flutter analyze \
            lib/pages/menu/menu.dart \
            lib/pages/my/my_page.dart \
            lib/pages/my/my_space_view.dart \
            --no-fatal-infos

      # ============================================================
      # 构建 Debug APK
      #
      # 不用正式签名 Secrets，
      # 比 Release 更适合快速 UI 测试。
      # ============================================================

      - name: 构建测试 APK
        run: |
          flutter build apk --debug

      # ============================================================
      # 检查产物
      # ============================================================

      - name: 检查 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::没有找到测试 APK"
            exit 1
          fi

          cp \
            "$APK" \
            "build/app/outputs/flutter-apk/XingFanWu-MyPage-Preview.apk"

          echo "新版我的页面 APK 构建成功"
          ls -lh \
            build/app/outputs/flutter-apk/XingFanWu-MyPage-Preview.apk

      # ============================================================
      # 上传 APK
      # ============================================================

      - name: 上传测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingFanWu-MyPage-Preview
          path: build/app/outputs/flutter-apk/XingFanWu-MyPage-Preview.apk
          if-no-files-found: error
          retention-days: 7
