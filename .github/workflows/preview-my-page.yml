name: 新版我的页面预览 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: 构建新版我的页面
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      # ============================================================
      # 修改底部导航“我的”图标
      # ============================================================

      - name: 修改我的导航图标
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/pages/menu/menu.dart")
          text = path.read_text(encoding="utf-8")

          old_portrait = """NavigationDestination(
            selectedIcon: Icon(Icons.settings),
            icon: Icon(Icons.settings),
            label: '我的',
          ),"""

          new_portrait = """NavigationDestination(
            selectedIcon: Icon(Icons.person),
            icon: Icon(Icons.person_outline),
            label: '我的',
          ),"""

          old_landscape = """NavigationRailDestination(
                  selectedIcon: Icon(Icons.settings),
                  icon: Icon(Icons.settings_outlined),
                  label: Text('我的'),
                ),"""

          new_landscape = """NavigationRailDestination(
                  selectedIcon: Icon(Icons.person),
                  icon: Icon(Icons.person_outline),
                  label: Text('我的'),
                ),"""

          if old_portrait not in text:
              raise SystemExit(
                  "没有找到竖屏“我的”导航代码，已停止，避免错误修改。"
              )

          if old_landscape not in text:
              raise SystemExit(
                  "没有找到横屏“我的”导航代码，已停止，避免错误修改。"
              )

          text = text.replace(
              old_portrait,
              new_portrait,
              1,
          )

          text = text.replace(
              old_landscape,
              new_landscape,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print("我的导航图标修改完成")
          PY

      # ============================================================
      # 替换 MyPage
      #
      # 保留原项目：
      # - Controller attach / detach
      # - Observer
      # - RouteVisibility
      # - flutter_modular 路由
      #
      # 不写自定义页面切换动画
      # 返回动画继续交给 Flutter / 上游路由系统
      # ============================================================

      - name: 写入新版 MyPage
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/pages/my/my_page.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_mobx/flutter_mobx.dart';
          import 'package:flutter_modular/flutter_modular.dart';

          import 'package:kazumi/bean/appbar/sys_app_bar.dart';
          import 'package:kazumi/pages/menu/route_visibility.dart';
          import 'package:kazumi/pages/my/my_controller.dart';
          import 'package:kazumi/pages/my/my_space_view.dart';

          class MyPage extends StatefulWidget {
            const MyPage({
              super.key,
              required this.controller,
            });

            final MyController controller;

            @override
            State<MyPage> createState() => _MyPageState();
          }

          class _MyPageState extends State<MyPage> {
            bool _attached = false;

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();

              _setAttached(
                !RouteVisibility.isCoveredOf(context),
              );
            }

            @override
            void didUpdateWidget(
              covariant MyPage oldWidget,
            ) {
              super.didUpdateWidget(oldWidget);

              if (_attached &&
                  oldWidget.controller != widget.controller) {
                oldWidget.controller.detach();
                widget.controller.attach();
              }
            }

            @override
            void dispose() {
              _setAttached(false);
              super.dispose();
            }

            void _setAttached(bool value) {
              if (_attached == value) {
                return;
              }

              _attached = value;

              if (value) {
                widget.controller.attach();
              } else {
                widget.controller.detach();
              }
            }

            void _open(
              MyDestination destination,
            ) {
              context.pushNamed(
                switch (destination) {
                  MyDestination.theme =>
                    '/settings/theme',

                  MyDestination.player =>
                    '/settings/player',

                  MyDestination.danmaku =>
                    '/settings/danmaku/',

                  MyDestination.rules =>
                    '/settings/plugin/',

                  MyDestination.history =>
                    '/settings/history/',

                  MyDestination.downloads =>
                    '/settings/download/',

                  MyDestination.sync =>
                    '/settings/sync',

                  MyDestination.storage =>
                    '/settings/storage',

                  MyDestination.update =>
                    '/settings/update',

                  MyDestination.settings =>
                    '/settings/',

                  MyDestination.about =>
                    '/settings/about/',
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: SysAppBar(
                  toolbarHeight: 72,
                  needTopOffset: false,
                  title: Text(
                    '我的',
                    style: Theme.of(context)
                        .textTheme
                        .headlineSmall
                        ?.copyWith(
                          fontWeight: FontWeight.w700,
                        ),
                  ),
                  actions: [
                    Padding(
                      padding: const EdgeInsets.only(
                        right: 6,
                      ),
                      child: IconButton(
                        tooltip: '外观主题',
                        icon: const Icon(
                          Icons.dark_mode_outlined,
                        ),
                        onPressed: () {
                          context.pushNamed(
                            '/settings/theme',
                          );
                        },
                      ),
                    ),
                  ],
                ),
                body: SafeArea(
                  top: false,
                  bottom: false,
                  child: Observer(
                    builder: (context) {
                      return MySpaceView(
                        stats:
                            widget.controller.watchStats,
                        onOpen: _open,
                        onCheckUpdate: () {
                          widget.controller
                              .checkUpdate();
                        },
                      );
                    },
                  ),
                ),
              );
            }
          }
          DART

